name: CI

# Runs on every push and pull request. The whole point of this workflow is that
# it needs NOTHING from the environment: no DATABASE_URL, no Turso or Neon
# credentials, no secrets of any kind. CORE-03A made `core/db.ts` initialise
# lazily precisely so the suite could run in a clean container — if a change
# ever reintroduces a hard database dependency at import time, this job is
# where it will surface.
#
# Deliberately absent: migrations, seeds, backfills, schema pushes, deploys and
# any step that writes data anywhere.

on:
  push:
  pull_request:

# Read-only. This workflow never writes to the repository, publishes packages
# or touches deployments.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the runtime the project is developed and tested against.
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if the two
      # ever drift, which also guards the "no new dependencies" rule.
      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code that is gitignored, so it has to be
      # produced before anything type-checks against it. Generation reads the
      # schema file only — it opens no connection and touches no database.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Discovers and runs every *.test.ts / *.test.tsx exactly once. No
      # database environment is provided on purpose.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
