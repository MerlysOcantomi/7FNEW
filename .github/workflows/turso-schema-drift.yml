name: Turso schema

# Guards the two Turso tools:
#   turso:bootstrap — creates the schema on an EMPTY database, nothing else
#   turso:verify    — compares a database against schema.prisma, read-only
#
# Fails when the target guard stops refusing ambiguous databases, when
# bootstrap stops being empty-only or atomic, or when the read-only comparison
# stops detecting a structural difference. Runs entirely against throwaway
# local SQLite files: no credentials, no secrets, no remote database.
#
# It runs on every branch push, not just on `master`: this repository ships
# straight to `master`, so a check that only ran there would report a problem
# after the fact instead of preventing it.

on:
  pull_request:
    branches: [master]
    paths: &watched
      - prisma/schema.prisma
      - prisma/turso-schema.ts
      - prisma/bootstrap-turso.ts
      - prisma/verify-turso.ts
      - prisma.config.ts
      - scripts/turso-target-guard.test.ts
      - scripts/turso-bootstrap.test.ts
      - scripts/turso-verify.test.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/turso-schema-drift.yml
  push:
    branches: ['**']
    paths: *watched

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Guard, bootstrap and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck` runs `prisma generate` first: the generated client
      # lives outside the repository, so a clean checkout cannot typecheck
      # without it.
      - name: Typecheck
        run: npm run typecheck

      - name: Run Turso guard, bootstrap and verify suites
        run: npm run test:turso
