# NEON-04 — manual ETL Turso → Neon staging (workflow_dispatch ONLY).
#
# This file lives on master solely so GitHub shows the "Run workflow" button.
# It never runs on push, pull_request or schedule. The job checks out and
# executes the PINNED NEON-04 commit, not master: the ETL code, its guards and
# the parity verifier in scripts/db/ remain the single authority — nothing is
# re-implemented here.
#
# Actions
#   preflight        READ-ONLY: secrets present, npm ci, db:etl:plan (no connection),
#                    then one read-only transaction on the staging database proving
#                    current_database, the staging identity marker, the canonical
#                    ledger (0_init + pinned checksum), the 50 canonical tables and
#                    nothing else, zero sequences and zero rows in every table.
#                    No stamp, no truncate, no ETL, no write anywhere.
#   load_and_parity  preflight, then `db:etl:run` (NO --reset-target) and
#                    `db:etl:parity --live-source`. Requires confirmation == LOAD-STAGING.
#
# Secrets (repository/environment secrets; never echoed, never uploaded):
#   TURSO_DATABASE_URL        → ETL_SOURCE_URL        (read-only source)
#   TURSO_AUTH_TOKEN          → ETL_SOURCE_AUTH_TOKEN
#   NEON04_STAGING_DIRECT_URL → ETL_TARGET_URL        (Neon DIRECT endpoint, no pooler)
#
# Non-secret target identity (hard-coded on purpose; the tooling refuses anything else):
#   role staging · host ep-super-violet-b2ekwpwn.c-6.eu-central-1.aws.neon.tech
#   database neondb · staging id old-wave-11795585 (Neon project 7f-staging)

name: NEON-04 staging ETL (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "preflight = read-only checks only · load_and_parity = ETL run + parity (needs confirmation)"
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - load_and_parity
      confirmation:
        description: "Type LOAD-STAGING to allow load_and_parity (ignored for preflight)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One staging load at a time; never cancel a load that is already running.
concurrency:
  group: neon04-staging-etl
  cancel-in-progress: false

env:
  NEON04_COMMIT: ebf736be3b6322bcf133b9bc1023de35d3bdb950
  NEON04_TARGET_ROLE: staging
  NEON04_TARGET_HOST: ep-super-violet-b2ekwpwn.c-6.eu-central-1.aws.neon.tech
  NEON04_TARGET_DB: neondb
  NEON04_STAGING_ID: old-wave-11795585
  MANIFEST_PATH: neon04-staging-evidence/neon04-staging.manifest.json

jobs:
  staging-etl:
    name: ${{ inputs.action }} against Neon staging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Gate the requested action
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            preflight)
              echo "action=preflight (read-only)"
              ;;
            load_and_parity)
              if [ "$CONFIRMATION" != "LOAD-STAGING" ]; then
                echo "::error::load_and_parity requires confirmation to be exactly LOAD-STAGING; refusing"
                exit 1
              fi
              echo "action=load_and_parity (confirmed)"
              ;;
            *)
              echo "::error::unknown action"
              exit 1
              ;;
          esac

      - name: Verify required secrets are present (values never printed)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEON04_STAGING_DIRECT_URL: ${{ secrets.NEON04_STAGING_DIRECT_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in TURSO_DATABASE_URL TURSO_AUTH_TOKEN NEON04_STAGING_DIRECT_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is not set or empty"
              missing=1
            else
              echo "secret $name: present"
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Checkout the pinned NEON-04 commit (not master)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEON04_COMMIT }}
          persist-credentials: false

      - name: Verify the checked-out commit is the pinned one
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "HEAD=$head"
          [ "$head" = "$NEON04_COMMIT" ] || { echo "::error::checked out $head, expected $NEON04_COMMIT"; exit 1; }
          sha="$(sha256sum prisma/migrations-postgres/0_init/migration.sql | cut -d' ' -f1)"
          echo "0_init sha256=$sha"
          [ "$sha" = "679d9d18e72a3fa101bd96f6c39b2194ba38ae86de35359a3e46be8d662af30e" ] || { echo "::error::0_init baseline differs from the pinned sha256"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Plan (parses the target schema; opens no connection)
        run: npm run db:etl:plan

      # Read-only preflight on the LIVE staging database, inside a READ ONLY
      # transaction that is rolled back. Reuses the NEON-04 tooling's own
      # exports (URL/identity guard, marker check, canonical schema, pinned
      # checksum) so nothing is re-implemented; only the SQL probes are inline.
      - name: Preflight the staging target (read-only)
        env:
          ETL_TARGET_URL: ${{ secrets.NEON04_STAGING_DIRECT_URL }}
        run: |
          set -euo pipefail
          cat > neon04-preflight.tmp.ts <<'TS'
          import { Client } from "pg"
          import { BASELINE_SHA256, assertTargetUrl, checkStagingMarker, loadSchema } from "./scripts/db/etl-turso-to-postgres"

          const redact = (text: string) => text.replace(/postgres(ql)?:\/\/\S+/gi, "<redacted-url>")
          const fail = (message: string): never => { throw new Error(message) }

          async function main(): Promise<void> {
            const url = process.env.ETL_TARGET_URL ?? ""
            if (!url) fail("ETL_TARGET_URL is not set")
            const expectation = {
              role: process.env.NEON04_TARGET_ROLE as "staging",
              host: process.env.NEON04_TARGET_HOST!,
              database: process.env.NEON04_TARGET_DB!,
              stagingId: process.env.NEON04_STAGING_ID!,
            }
            assertTargetUrl(url, expectation)
            const schema = loadSchema()
            const pg = new Client({ connectionString: url })
            await pg.connect()
            try {
              await pg.query("BEGIN READ ONLY")
              const who = await pg.query<{ db: string; version: string }>("SELECT current_database() AS db, version() AS version")
              if (who.rows[0].db !== expectation.database) fail("current_database() does not match the expected staging database")
              console.log(`[preflight] current_database=${who.rows[0].db} server=${who.rows[0].version.split(" on ")[0]}`)

              const comment = await pg.query<{ description: string | null }>(
                "SELECT d.description FROM pg_database db LEFT JOIN pg_shdescription d ON d.objoid = db.oid AND d.classoid = 'pg_database'::regclass WHERE db.datname = current_database()",
              )
              const marker = checkStagingMarker(comment.rows[0]?.description ?? null, expectation.stagingId)
              console.log(`[preflight] staging marker OK: environment=${marker.environment} migration=${marker.migration} target=${marker.target}`)

              const ledger = await pg.query<{ migration_name: string; checksum: string; finished: boolean; rolled_back: boolean; steps: number }>(
                'SELECT migration_name, checksum, finished_at IS NOT NULL AS finished, rolled_back_at IS NOT NULL AS rolled_back, applied_steps_count AS steps FROM "_prisma_migrations"',
              )
              if (ledger.rows.length !== 1) fail(`ledger has ${ledger.rows.length} row(s); expected exactly 1 (0_init)`)
              const init = ledger.rows[0]
              if (init.migration_name !== "0_init" || !init.finished || init.rolled_back || Number(init.steps) !== 1) fail("ledger row is not a completed, non-rolled-back 0_init with applied_steps_count=1")
              if (init.checksum !== BASELINE_SHA256) fail("0_init checksum differs from the pinned baseline")
              console.log(`[preflight] ledger OK: 0_init checksum=${init.checksum}`)

              const tables = await pg.query<{ table_name: string }>("SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")
              const present = new Set(tables.rows.map((r) => r.table_name))
              const expected = new Set([...schema.tables.map((t) => t.name), "_prisma_migrations"])
              const missing = [...expected].filter((t) => !present.has(t))
              const extra = [...present].filter((t) => !expected.has(t))
              if (missing.length || extra.length) fail(`canonical table set mismatch: missing=[${missing.join(",")}] extra=[${extra.join(",")}]`)
              console.log(`[preflight] tables OK: ${schema.tables.length} canonical application tables + _prisma_migrations (${present.size} base tables in public)`)

              const sequences = await pg.query<{ n: string }>("SELECT COUNT(*)::text AS n FROM pg_sequences WHERE schemaname = 'public'")
              if (Number(sequences.rows[0].n) !== 0) fail(`public has ${sequences.rows[0].n} sequence(s); the canonical schema has none`)
              console.log("[preflight] sequences OK: 0")

              const nonEmpty: string[] = []
              let total = 0
              for (const t of schema.tables) {
                const r = await pg.query<{ n: string }>(`SELECT COUNT(*)::text AS n FROM "${t.name}"`)
                const n = Number(r.rows[0].n)
                total += n
                if (n > 0) nonEmpty.push(`${t.name}=${n}`)
              }
              if (nonEmpty.length) fail(`${nonEmpty.length} application table(s) already hold rows: ${nonEmpty.join(", ")}`)
              console.log(`[preflight] rows OK: 0 rows across ${schema.tables.length} application tables (total=${total})`)
              await pg.query("ROLLBACK")
              console.log("[preflight] PASS — read-only transaction rolled back; nothing was written")
            } finally {
              await pg.end()
            }
          }

          main().catch((err) => {
            console.error(`[preflight] FAIL: ${redact(err instanceof Error ? err.message : String(err))}`)
            process.exit(1)
          })
          TS
          npx tsx neon04-preflight.tmp.ts
          rm -f neon04-preflight.tmp.ts

      - name: Load Turso snapshot into Neon staging (existing db:etl:run, no reset)
        if: ${{ inputs.action == 'load_and_parity' }}
        env:
          ETL_SOURCE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          ETL_SOURCE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ETL_TARGET_URL: ${{ secrets.NEON04_STAGING_DIRECT_URL }}
        run: |
          set -euo pipefail
          mkdir -p neon04-staging-evidence
          npm run db:etl:run -- \
            --target-role "$NEON04_TARGET_ROLE" \
            --expect-target-host "$NEON04_TARGET_HOST" \
            --expect-target-database "$NEON04_TARGET_DB" \
            --expect-staging-id "$NEON04_STAGING_ID" \
            --manifest "$MANIFEST_PATH" 2>&1 | tee neon04-staging-evidence/etl-run.log

      - name: Verify parity against the manifest and the live source (existing db:etl:parity)
        if: ${{ inputs.action == 'load_and_parity' }}
        env:
          ETL_SOURCE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          ETL_SOURCE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ETL_TARGET_URL: ${{ secrets.NEON04_STAGING_DIRECT_URL }}
        run: |
          set -euo pipefail
          npm run db:etl:parity -- \
            --target-role "$NEON04_TARGET_ROLE" \
            --expect-target-host "$NEON04_TARGET_HOST" \
            --expect-target-database "$NEON04_TARGET_DB" \
            --expect-staging-id "$NEON04_STAGING_ID" \
            --manifest "$MANIFEST_PATH" \
            --live-source 2>&1 | tee neon04-staging-evidence/etl-parity.log

      # Evidence only: the manifest (counts, digests, fingerprints, timings — no
      # values, no URLs) and the two logs (the ETL never prints connection
      # strings). No .env, no secrets.
      - name: Upload manifest and parity evidence
        if: ${{ always() && inputs.action == 'load_and_parity' }}
        uses: actions/upload-artifact@v4
        with:
          name: neon04-staging-etl-evidence-${{ github.run_id }}
          path: neon04-staging-evidence/
          if-no-files-found: ignore
          retention-days: 30
